# render.yaml — Gihozo Pharmacy Management System
# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure-as-code for Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# HOW TO USE:
#   1. Place this file at the ROOT of your repository (next to /client & /server)
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your GitHub repo — Render will read this file automatically
#   4. Fill in the SECRET environment variables in the Render dashboard:
#        - JWT_SECRET
#        - JWT_REFRESH_SECRET
#   5. Deploy!
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend API (Express + SQLite) ─────────────────────────────────────────
  - type: web
    name: gihozo-api
    runtime: node
    nodeVersion: 20.19.4      # ← REQUIRED: better-sqlite3 native bindings break on Node 24
    region: frankfurt         # closest to Africa/Kigali — change if preferred
    plan: free                # upgrade to starter for persistent disk + no sleep

    # rootDir is relative to the repo root
    rootDir: server

    # Build: install production dependencies only
    buildCommand: npm install --omit=dev

    # Start command
    startCommand: node index.js

    # Render uses this to verify the service started correctly
    healthCheckPath: /api/health

    # ── Environment Variables ────────────────────────────────────────────────
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      # ⚠️  Update to your actual Render Static Site URL after first deploy
      # Example: https://gihozo-web.onrender.com
      - key: CLIENT_URL
        value: https://igihozo.onrender.com

      # JWT Secrets — sync:false means Render will prompt you for values in dashboard
      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # SQLite path (relative to server/ rootDir)
      # For data persistence across deploys → attach a Render Disk (paid) and use /data/gihozo.db
      - key: DB_PATH
        value: ./database/gihozo.db

      - key: APP_NAME
        value: Gihozo Pharmacy

      - key: APP_VERSION
        value: 1.0.0

      # RENDER_EXTERNAL_URL is injected automatically by Render — do NOT set it manually.
      # The cron job reads it to ping the correct public URL.

  # ── Frontend (React + Vite Static Site) ────────────────────────────────────
  - type: web
    name: gihozo-web
    runtime: static
    region: frankfurt

    rootDir: client

    # Vite automatically loads client/.env.production during this build
    buildCommand: npm install && npm run build

    # Vite output directory
    staticPublishPath: dist

    # SPA routing: all routes fall back to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Security & caching headers
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
